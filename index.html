<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gympass</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #222222;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #c8f135;
    --accent-dim: rgba(200,241,53,0.12);
    --red: #ff4d4d;
    --blue: #4d9fff;
    --radius: 16px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* HEADER */
  .header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .header-date {
    font-size: 12px;
    color: var(--muted);
  }

  /* HERO */
  .hero {
    padding: 28px 20px 0;
  }
  .hero-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .quote-block {
    background: var(--accent-dim);
    border: 1px solid rgba(200,241,53,0.2);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 6px;
  }
  .quote-text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--accent);
  }
  .quote-sub {
    font-size: 12px;
    color: rgba(200,241,53,0.55);
    margin-top: 6px;
  }

  /* WEEK STATUS */
  .week-bar {
    display: flex;
    gap: 6px;
    padding: 18px 20px 0;
    align-items: center;
  }
  .week-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 6px;
    white-space: nowrap;
  }
  .week-pill {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--bg3);
    position: relative;
    overflow: hidden;
  }
  .week-pill.done { background: var(--accent); }
  .week-pill.today { background: linear-gradient(90deg, var(--accent), rgba(200,241,53,0.3)); }
  .week-name {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
  }
  .week-col { display: flex; flex-direction: column; flex: 1; }

  /* SECTION TITLE */
  .section-head {
    padding: 24px 20px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .section-hint {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.6;
  }

  /* PERSON CARDS */
  .cards {
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .person-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }
  .person-card:active { transform: scale(0.97); }
  .person-card.per { --person-color: #c8f135; }
  .person-card.alex { --person-color: #4d9fff; }
  .person-card.nia { --person-color: #ff7eb6; }
  .person-card.hannes { --person-color: #ffa94d; }

  .person-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--person-color);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--person-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--person-color);
  }
  .card-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    color: var(--muted);
  }
  .card-badge.trained {
    background: rgba(200,241,53,0.1);
    color: var(--accent);
  }

  .card-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .card-last {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .card-lifts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .lift-item {
    display: flex;
    flex-direction: column;
  }
  .lift-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1px;
  }
  .lift-val {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .lift-val span {
    font-size: 10px;
    font-weight: 400;
    color: var(--muted);
  }

  .card-cta {
    margin-top: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--person-color);
    letter-spacing: 0.04em;
  }

  /* NEXT WORKOUT BANNER */
  .next-banner {
    margin: 16px 20px 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .next-left { flex: 1; }
  .next-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .next-day {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .next-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .next-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  /* MODAL / WORKOUT VIEW */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    margin-top: auto;
    padding: 0 0 40px;
    min-height: 85vh;
    transform: translateY(40px);
    transition: transform 0.25s cubic-bezier(0.32,0,0,1);
  }
  .modal-overlay.open .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin: 14px auto 0;
  }
  .modal-header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-person {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .modal-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    border: 2px solid;
  }
  .modal-name { font-size: 22px; font-weight: 700; }
  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg3);
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .exercise-block {
    margin: 20px 20px 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .exercise-title {
    padding: 14px 16px 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .set-row {
    display: grid;
    grid-template-columns: 28px 1fr 80px 60px;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .set-row:last-child { border-bottom: none; }
  .set-num {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }
  .set-type {
    font-size: 12px;
    color: var(--muted);
  }
  .set-weight {
    font-size: 16px;
    font-weight: 700;
    text-align: right;
  }
  .set-reps {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }
  .set-row.top-set .set-weight { color: var(--accent); }
  .set-row.top-set .set-type { color: rgba(200,241,53,0.7); }

  .rest-note {
    margin: 12px 20px 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  /* ONBOARDING (nytt) */
  .onboarding-step {
    padding: 28px 20px 10px;
  }
  .onboarding-emoji { font-size: 40px; margin-bottom: 14px; }
  .onboarding-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .onboarding-sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 22px;
  }

  /* Stegindikator överst i onboarding */
  .progress-dots {
    display: flex;
    gap: 6px;
    padding: 20px 20px 0;
  }
  .progress-dot { height: 4px; flex: 1; border-radius: 2px; background: var(--bg3); }
  .progress-dot.active { background: var(--accent); }

  /* Valbara motivationsprofiler */
  .profile-card {
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s, background 0.15s;
  }
  .profile-card.selected { border-color: var(--accent); background: var(--accent-dim); }
  .profile-card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .profile-card.selected .profile-card-title { color: var(--accent); }
  .profile-card-desc { font-size: 12px; color: var(--muted); line-height: 1.4; }

  /* Justering av startvikter (+/- 2,5 kg) */
  .weight-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .weight-row-label { font-size: 14px; font-weight: 700; }
  .weight-row-hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .stepper-btn:active { background: var(--accent-dim); }
  .stepper-val { font-size: 16px; font-weight: 700; min-width: 60px; text-align: center; }

  /* Stora knappar för svettiga händer på gymmet */
  .btn-primary {
    display: block;
    width: 100%;
    margin: 24px 20px 0;
    padding: 18px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #0f0f0f;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-secondary {
    display: block;
    width: 100%;
    margin: 10px 20px 0;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Veckostatus: prickar per person under varje dag i week-bar */
  .week-dots {
    display: flex;
    gap: 3px;
    justify-content: center;
    margin-top: 5px;
  }
  .week-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bg3);
  }

  /* EFTER-PASS-KÄNSLA (nytt) */
  .feeling-grid {
    padding: 4px 20px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .feeling-card {
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 10px;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s, background 0.15s;
  }
  .feeling-card:active { border-color: var(--accent); background: var(--accent-dim); }
  .feeling-card:last-child { grid-column: 1 / -1; }
  .feeling-emoji { font-size: 28px; margin-bottom: 6px; }
  .feeling-label { font-size: 13px; font-weight: 700; }

  /* HISTORIK – "Mina pass" (nytt) */
  .history-list {
    margin: 8px 20px 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .history-row:last-child { border-bottom: none; }
  .history-date { font-size: 12px; color: var(--muted); min-width: 64px; }
  .history-weights { font-size: 12px; font-weight: 600; flex: 1; text-align: center; }
  .history-feeling { font-size: 18px; }
  .history-empty {
    margin: 8px 20px 0;
    padding: 14px 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">Gympass</div>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="hero">
  <div class="hero-label">Veckans motivationsord</div>
  <div class="quote-block">
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-sub" id="quoteSub"></div>
  </div>
</div>

<div class="week-bar">
  <div class="week-label">Denna vecka</div>
  <div class="week-col"><div class="week-pill" id="w-mon"></div><div class="week-dots" id="wd-mon"></div><div class="week-name">Mån</div></div>
  <div class="week-col"><div class="week-pill" id="w-tue"></div><div class="week-dots" id="wd-tue"></div><div class="week-name">Tis</div></div>
  <div class="week-col"><div class="week-pill" id="w-wed"></div><div class="week-dots" id="wd-wed"></div><div class="week-name">Ons</div></div>
  <div class="week-col"><div class="week-pill" id="w-thu"></div><div class="week-dots" id="wd-thu"></div><div class="week-name">Tor</div></div>
  <div class="week-col"><div class="week-pill" id="w-fri"></div><div class="week-dots" id="wd-fri"></div><div class="week-name">Fre</div></div>
  <div class="week-col"><div class="week-pill" id="w-sat"></div><div class="week-dots" id="wd-sat"></div><div class="week-name">Lör</div></div>
  <div class="week-col"><div class="week-pill" id="w-sun"></div><div class="week-dots" id="wd-sun"></div><div class="week-name">Sön</div></div>
</div>

<div class="next-banner">
  <div class="next-left">
    <div class="next-label">Nästa obligatoriska pass</div>
    <div class="next-day" id="nextDay">Måndag</div>
    <div class="next-sub">Bänkpress · Benböj · Marklyft · Latsdrag</div>
  </div>
  <div class="next-icon">🏋️</div>
</div>

<div class="section-head">
  <div class="section-title">Välj person</div>
  <div class="section-hint">Tryck för att se ditt pass</div>
</div>

<!-- Personkorten renderas av JS (renderCards) utifrån "people"-objektet och sparat state -->
<div class="cards" id="cardsContainer"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-person">
        <div class="modal-avatar" id="modalAvatar"></div>
        <div class="modal-name" id="modalName"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalContent"></div>
    <div class="rest-note">⏱ Vila ca 2 minuter mellan varje set</div>
    <button class="btn-primary" onclick="finishWorkout()">Avsluta pass ✅</button>
    <div id="historySection"></div>
  </div>
</div>

<!-- ONBOARDING-MODAL: visas första gången en person öppnar sitt kort -->
<div class="modal-overlay" id="onboardingOverlay">
  <div class="modal" id="onboardingModal">
    <div class="modal-handle"></div>
    <div id="onboardingProgress" class="progress-dots"></div>
    <div id="onboardingContent"></div>
  </div>
</div>

<!-- EFTER-PASS-KÄNSLA: visas direkt efter "Avsluta pass" -->
<div class="modal-overlay" id="feelingOverlay">
  <div class="modal" id="feelingModal">
    <div class="modal-handle"></div>
    <div id="feelingContent"></div>
  </div>
</div>

<script>
// "people" är grundkällan för vilka som finns i appen och deras startvikter.
// En ny kollega läggs till genom att lägga till ett objekt här – kort,
// onboarding och pass genereras automatiskt av JS nedan.
const people = {
  per:    { name: 'Per',    initials: 'PH', color: '#c8f135', role: 'Coach', bp: 45, sq: 60, dl: 60, lat: null },
  alex:   { name: 'Alex',   initials: 'AL', color: '#4d9fff', bp: 45, sq: 60, dl: 60, lat: null },
  nia:    { name: 'Nia',    initials: 'NI', color: '#ff7eb6', bp: 35, sq: 20, dl: 30, lat: null },
  hannes: { name: 'Hannes', initials: 'HA', color: '#ffa94d', bp: 27, sq: 22, dl: 27, lat: null }
};

const quotes = [
  { text: 'Varje lyft räknas. Varje set bygger något.', sub: 'Konsistens slår motivation – varje gång.' },
  { text: 'Du är starkare idag än igår.', sub: 'Progressiv överbelastning är magin.' },
  { text: 'Gymmet är inte ett straff. Det är din tid.', sub: 'Fyra övningar. Sex set. Klar.' },
  { text: 'Tekniken först. Vikten kommer.', sub: 'Rätt rörelse är grunden till allt.' },
  { text: 'Ingen regret efter ett gympass.', sub: 'Det vet ni allihopa nu.' }
];

// De fyra motivationsprofilerna som väljs i onboarding (kan bytas senare).
const motivationProfiles = [
  { id: 1, title: 'Siffrorna ljuger inte', desc: 'Du motiveras av viktutveckling och tydliga grafer på din progression.' },
  { id: 2, title: 'Tillsammans är vi starkare', desc: 'Du motiveras av att träna som grupp och peppa varandra.' },
  { id: 3, title: 'Jag mår bättre när jag tränar', desc: 'Du motiveras av välmående, energi och hur kroppen känns.' },
  { id: 4, title: 'Jag vill överraska mig själv', desc: 'Du motiveras av milstolpar, personbästa och beröm.' }
];

const days = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
const months = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

// Efter-pass-skalan 1-5, visas direkt efter "Avsluta pass".
const feelingOptions = [
  { id: 1, emoji: '🙂', label: 'Bra att jag kom',  message: 'Det räcker. Varje pass bygger vanan.' },
  { id: 2, emoji: '😐', label: 'Okej pass',        message: 'Solid insats. Kroppen anpassar sig.' },
  { id: 3, emoji: '💪', label: 'Bra pass',         message: 'Bra jobbat! Nästa måndag – dags att öka?' },
  { id: 4, emoji: '🔥', label: 'Starkt pass',      message: 'Du är på rätt spår. Få i dig protein inom 30 min!' },
  { id: 5, emoji: '🚀', label: 'Maxade idag 🔥',    message: 'BEAST! 🔥 Äta: kycklingfilé, ris och grönsaker inom 45 min. Drick 0,5L vatten nu. Nästa pass: öka med 2,5 kg!' }
];

function r(w, pct) { return Math.round(w * pct / 2.5) * 2.5; }

function buildSets(w, name) {
  if (!w) return `<div style="padding:14px 16px;font-size:13px;color:#888;">Vikt ej registrerad ännu</div>`;
  const sets = [
    { label: 'Uppvärmning',  pct: 0.70, reps: 5,  top: false },
    { label: 'Uppvärmning',  pct: 0.80, reps: 3,  top: false },
    { label: 'Toppset 🔥',   pct: 0.95, reps: 1,  top: true  },
    { label: 'Arbetsserie',  pct: 0.87, reps: 5,  top: false },
    { label: 'Arbetsserie',  pct: 0.87, reps: 5,  top: false },
    { label: 'Arbetsserie',  pct: 0.87, reps: 5,  top: false },
  ];
  return sets.map((s, i) => `
    <div class="set-row ${s.top ? 'top-set' : ''}">
      <div class="set-num">${i+1}</div>
      <div class="set-type">${s.label}</div>
      <div class="set-weight">${r(w, s.pct)} kg</div>
      <div class="set-reps">× ${s.reps}</div>
    </div>`).join('');
}

// --- LAGRING (localStorage) -------------------------------------------
// Varje person har ett eget state: onboarded, vald motivationsprofil,
// aktuella vikter och historik över genomförda pass.
const STORAGE_PREFIX = 'gympass_';

// Historik (genomförda pass) lagras separat per person under
// nyckeln "gympass_[personnamn]_history", enligt spec.
function historyKey(id) { return STORAGE_PREFIX + id + '_history'; }

function loadHistory(id) {
  const raw = localStorage.getItem(historyKey(id));
  return raw ? JSON.parse(raw) : [];
}

function saveHistory(id, history) {
  localStorage.setItem(historyKey(id), JSON.stringify(history));
}

function loadPersonState(id) {
  const raw = localStorage.getItem(STORAGE_PREFIX + id);
  const base = people[id];
  const state = raw ? JSON.parse(raw) : {
    onboarded: false,
    profile: null,
    weights: { bp: base.bp, sq: base.sq, dl: base.dl, lat: base.lat }
  };
  state.history = loadHistory(id);
  return state;
}

// Sparar bara profil/vikter här – historiken sparas separat (se historyKey).
function savePersonState(id, state) {
  localStorage.setItem(STORAGE_PREFIX + id, JSON.stringify({
    onboarded: state.onboarded,
    profile: state.profile,
    weights: state.weights
  }));
}

// Måndag (00:00) i veckan för ett givet datum – används för veckostatus.
function getMonday(date) {
  const d = new Date(date);
  const diff = (d.getDay() === 0 ? -6 : 1) - d.getDay();
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function hasTrainedThisWeek(state) {
  if (!state.history.length) return false;
  const monday = getMonday(new Date());
  return state.history.some(h => new Date(h.date) >= monday);
}

function lastTrainedText(state) {
  if (!state.history.length) return 'Inte tränat ännu';
  const last = new Date(state.history[state.history.length - 1].date);
  return 'Senast: ' + days[last.getDay()] + ' ' + last.getDate() + ' ' + months[last.getMonth()];
}

// --- RENDERING AV PERSONKORT (dashboard) --------------------------------
function liftValueHtml(label, value) {
  return `<div class="lift-item"><div class="lift-label">${label}</div>` +
    (value == null
      ? `<div class="lift-val">– <span></span></div>`
      : `<div class="lift-val">${value} <span>kg</span></div>`) +
    `</div>`;
}

function renderCards() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = Object.keys(people).map(id => {
    const p = people[id];
    const state = personStates[id];
    const trained = hasTrainedThisWeek(state);
    const badgeText = p.role ? p.role : (trained ? 'Tränat ✓' : '–');
    const badgeClass = !p.role && trained ? 'trained' : '';
    return `
    <div class="person-card ${id}" onclick="onCardClick('${id}')">
      <div class="card-top">
        <div class="avatar">${p.initials}</div>
        <div class="card-badge ${badgeClass}">${badgeText}</div>
      </div>
      <div class="card-name">${p.name}</div>
      <div class="card-last">${lastTrainedText(state)}</div>
      <div class="card-lifts">
        ${liftValueHtml('Bänk', state.weights.bp)}
        ${liftValueHtml('Benböj', state.weights.sq)}
        ${liftValueHtml('Marklyft', state.weights.dl)}
        ${liftValueHtml('Latsdrag', state.weights.lat)}
      </div>
      <div class="card-cta">${state.onboarded ? 'Öppna mitt pass →' : 'Kom igång →'}</div>
    </div>`;
  }).join('');
}

function onCardClick(id) {
  if (!personStates[id].onboarded) startOnboarding(id);
  else openModal(id);
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

// Ritar om veckostatusen (Mån-Sön) inkl. prickar för vilka personer som
// tränat vilken dag. Anropas vid sidladdning och efter avslutat pass.
function renderWeekBar() {
  const today = new Date();
  const monday = getMonday(today);
  const dayKeys = ['mon','tue','wed','thu','fri','sat','sun'];
  const todayIndex = (today.getDay() + 6) % 7; // Mån=0 ... Sön=6

  dayKeys.forEach((key, i) => {
    const dayDate = new Date(monday);
    dayDate.setDate(monday.getDate() + i);

    const pillEl = document.getElementById('w-' + key);
    pillEl.classList.remove('done', 'today');
    if (i < todayIndex) pillEl.classList.add('done');
    else if (i === todayIndex) pillEl.classList.add('today');

    const trainedIds = Object.keys(people).filter(id =>
      personStates[id].history.some(h => sameDay(new Date(h.date), dayDate))
    );
    document.getElementById('wd-' + key).innerHTML = Object.keys(people).map(id =>
      `<div class="week-dot" style="background:${trainedIds.includes(id) ? people[id].color : 'var(--bg3)'}"></div>`
    ).join('');
  });
}

// --- HISTORIK ("Mina pass") ----------------------------------------------
function feelingEmoji(feelingId) {
  const opt = feelingOptions.find(f => f.id === feelingId);
  return opt ? opt.emoji : '–';
}

function renderHistorySection(id) {
  const state = personStates[id];
  const recent = state.history.slice(-10).reverse();
  const el = document.getElementById('historySection');

  if (!recent.length) {
    el.innerHTML = `
      <div class="section-head"><div class="section-title">Mina pass</div></div>
      <div class="history-empty">Inga genomförda pass än.</div>`;
    return;
  }

  el.innerHTML = `
    <div class="section-head"><div class="section-title">Mina pass</div></div>
    <div class="history-list">
      ${recent.map(h => {
        const d = new Date(h.date);
        const dateStr = days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
        return `
        <div class="history-row">
          <div class="history-date">${dateStr}</div>
          <div class="history-weights">${h.weights.bp}/${h.weights.sq}/${h.weights.dl}/${h.weights.lat} kg</div>
          <div class="history-feeling">${feelingEmoji(h.feeling)}</div>
        </div>`;
      }).join('')}
    </div>`;
}

// --- ONBOARDING ----------------------------------------------------------
// Visas första gången en person trycker på sitt kort. Stegen är:
// 1) Välkomst  2) Välj motivationsprofil  3) Bekräfta/justera startvikter  4) Klart
let onboarding = null;
let currentModalPersonId = null;
let feelingPersonId = null;

function startOnboarding(id) {
  const base = personStates[id].weights;
  onboarding = {
    personId: id,
    step: 1,
    profile: null,
    // Latsdrag är okänd (TBD) för alla – föreslå 20 kg som startpunkt att justera från
    weights: { bp: base.bp, sq: base.sq, dl: base.dl, lat: base.lat ?? 20 }
  };
  document.getElementById('onboardingOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderOnboardingStep();
}

function closeOnboarding() {
  document.getElementById('onboardingOverlay').classList.remove('open');
  document.body.style.overflow = '';
  onboarding = null;
}

function weightRowHtml(key, label) {
  const isLat = key === 'lat';
  return `
    <div class="weight-row">
      <div>
        <div class="weight-row-label">${label}</div>
        ${isLat ? '<div class="weight-row-hint">Ny övning – välj en startvikt</div>' : ''}
      </div>
      <div class="stepper">
        <button class="stepper-btn" onclick="adjustOnboardingWeight('${key}', -2.5)">–</button>
        <div class="stepper-val">${onboarding.weights[key]} kg</div>
        <button class="stepper-btn" onclick="adjustOnboardingWeight('${key}', 2.5)">+</button>
      </div>
    </div>`;
}

function renderOnboardingStep() {
  const p = people[onboarding.personId];
  document.getElementById('onboardingProgress').innerHTML =
    [1, 2, 3, 4].map(n => `<div class="progress-dot ${n <= onboarding.step ? 'active' : ''}"></div>`).join('');

  let body = '';
  if (onboarding.step === 1) {
    body = `
      <div class="onboarding-step">
        <div class="onboarding-emoji">👋</div>
        <div class="onboarding-title">Välkommen, ${p.name}!</div>
        <div class="onboarding-sub">Innan du kör ditt första pass sätter vi upp din profil. Det tar under en minut.</div>
      </div>
      <button class="btn-primary" onclick="onboardingNext()">Kom igång →</button>`;
  } else if (onboarding.step === 2) {
    body = `
      <div class="onboarding-step">
        <div class="onboarding-title">Vad driver dig?</div>
        <div class="onboarding-sub">Välj den motivationsprofil som stämmer bäst – du kan byta senare.</div>
        ${motivationProfiles.map(mp => `
          <div class="profile-card ${onboarding.profile === mp.id ? 'selected' : ''}" onclick="selectProfile(${mp.id})">
            <div class="profile-card-title">${mp.title}</div>
            <div class="profile-card-desc">${mp.desc}</div>
          </div>`).join('')}
      </div>
      <button class="btn-primary" ${onboarding.profile ? '' : 'disabled'} onclick="onboardingNext()">Nästa →</button>
      <button class="btn-secondary" onclick="onboardingBack()">Tillbaka</button>`;
  } else if (onboarding.step === 3) {
    body = `
      <div class="onboarding-step">
        <div class="onboarding-title">Dina startvikter</div>
        <div class="onboarding-sub">Stämmer de här? Justera med +/- om du vill (steg om 2,5 kg).</div>
        ${weightRowHtml('bp', 'Bänkpress')}
        ${weightRowHtml('sq', 'Benböj')}
        ${weightRowHtml('dl', 'Marklyft')}
        ${weightRowHtml('lat', 'Latsdrag')}
      </div>
      <button class="btn-primary" onclick="onboardingNext()">Bekräfta →</button>
      <button class="btn-secondary" onclick="onboardingBack()">Tillbaka</button>`;
  } else if (onboarding.step === 4) {
    body = `
      <div class="onboarding-step">
        <div class="onboarding-emoji">✅</div>
        <div class="onboarding-title">Klart, ${p.name}!</div>
        <div class="onboarding-sub">Din profil och dina vikter är sparade. Nu kör vi ditt första pass.</div>
      </div>
      <button class="btn-primary" onclick="finishOnboarding()">Till mitt pass →</button>`;
  }
  document.getElementById('onboardingContent').innerHTML = body;
}

function adjustOnboardingWeight(key, delta) {
  const next = Math.max(0, onboarding.weights[key] + delta);
  onboarding.weights[key] = Math.round(next / 2.5) * 2.5;
  renderOnboardingStep();
}

function selectProfile(id) {
  onboarding.profile = id;
  renderOnboardingStep();
}

function onboardingNext() {
  if (onboarding.step === 2 && !onboarding.profile) return;
  onboarding.step++;
  renderOnboardingStep();
}

function onboardingBack() {
  onboarding.step--;
  renderOnboardingStep();
}

function finishOnboarding() {
  const id = onboarding.personId;
  personStates[id] = {
    onboarded: true,
    profile: onboarding.profile,
    weights: { ...onboarding.weights },
    history: []
  };
  savePersonState(id, personStates[id]);
  closeOnboarding();
  renderCards();
  openModal(id);
}

function openModal(id) {
  currentModalPersonId = id;
  const p = people[id];
  const state = personStates[id];
  document.getElementById('modalAvatar').textContent = p.initials;
  document.getElementById('modalAvatar').style.color = p.color;
  document.getElementById('modalAvatar').style.borderColor = p.color;
  document.getElementById('modalAvatar').style.background = p.color + '18';
  document.getElementById('modalName').textContent = p.name;

  const exercises = [
    { key: 'bp',  label: 'Bänkpress',  w: state.weights.bp  },
    { key: 'sq',  label: 'Benböj',     w: state.weights.sq  },
    { key: 'dl',  label: 'Marklyft',   w: state.weights.dl  },
    { key: 'lat', label: 'Latsdrag',   w: state.weights.lat },
  ];

  document.getElementById('modalContent').innerHTML = exercises.map(e => `
    <div class="exercise-block">
      <div class="exercise-title" style="color:${p.color}">${e.label}</div>
      ${buildSets(e.w, e.key)}
    </div>`).join('');

  renderHistorySection(id);

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// --- LOGGA GENOMFÖRT PASS + EFTER-PASS-KÄNSLA -----------------------------
function finishWorkout() {
  const id = currentModalPersonId;
  const state = personStates[id];

  // Spara datum/tid och dagens uträknade vikter. Känslan sätts i nästa steg.
  state.history.push({
    date: new Date().toISOString(),
    weights: { ...state.weights },
    feeling: null
  });
  saveHistory(id, state.history);

  closeModal();
  renderCards();
  renderWeekBar();

  feelingPersonId = id;
  showFeelingQuestion();
}

function showFeelingQuestion() {
  document.getElementById('feelingContent').innerHTML = `
    <div class="onboarding-step">
      <div class="onboarding-title">Hur kändes passet?</div>
    </div>
    <div class="feeling-grid">
      ${feelingOptions.map(f => `
        <div class="feeling-card" onclick="selectFeeling(${f.id})">
          <div class="feeling-emoji">${f.emoji}</div>
          <div class="feeling-label">${f.label}</div>
        </div>`).join('')}
    </div>`;
  document.getElementById('feelingOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function selectFeeling(feelingId) {
  const state = personStates[feelingPersonId];
  const lastSession = state.history[state.history.length - 1];
  lastSession.feeling = feelingId;
  saveHistory(feelingPersonId, state.history);

  const opt = feelingOptions.find(f => f.id === feelingId);
  document.getElementById('feelingContent').innerHTML = `
    <div class="onboarding-step">
      <div class="onboarding-emoji">${opt.emoji}</div>
      <div class="onboarding-title">${opt.label}</div>
      <div class="onboarding-sub">${opt.message}</div>
    </div>
    <button class="btn-primary" onclick="closeFeelingOverlay()">Klart</button>`;
}

function closeFeelingOverlay() {
  document.getElementById('feelingOverlay').classList.remove('open');
  document.body.style.overflow = '';
  feelingPersonId = null;
  renderCards();
}

// Initiera state för alla personer från localStorage och rendera korten
const personStates = {};
Object.keys(people).forEach(id => { personStates[id] = loadPersonState(id); });
renderCards();

// Date & quote
const now = new Date();
document.getElementById('headerDate').textContent =
  days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()];

const q = quotes[now.getDay() % quotes.length];
document.getElementById('quoteText').textContent = q.text;
document.getElementById('quoteSub').textContent = q.sub;

// Week bar – highlight today (Monday = obligatory) + tränings-prickar per person
renderWeekBar();

// Next Monday
const daysUntilMon = (8 - now.getDay()) % 7 || 7;
const nextMon = new Date(now); nextMon.setDate(now.getDate() + daysUntilMon);
document.getElementById('nextDay').textContent =
  'Måndag ' + nextMon.getDate() + ' ' + months[nextMon.getMonth()];
</script>
